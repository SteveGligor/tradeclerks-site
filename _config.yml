# GitHub Pages runs Jekyll on this repo. Only the built pages (index.html,
# terms.html, privacy.html), the customer page (v/index.html) and their assets
# are the site; the files below are
# the repo's own working files and are never published. CNAME is GitHub Pages'
# own default exclude, which a custom list replaces, so it's listed again.
# Entries match as prefixes: a new root file starting with one of these names
# won't be published either.
# Cloudflare is told the same by make-dist.mjs (its NOT_PUBLISHED list), and
# tests/published-files.test.mjs fails if the two disagree. This file goes when
# GitHub Pages is turned off (the move's last step).
exclude:
  - README.md
  - build.py
  - content
  - CNAME
  - tests
  - AGENTS.md
  - CLAUDE.md
  - make-dist.mjs
  - wrangler.jsonc
