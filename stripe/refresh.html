<title>Trade Clerks</title>
<!--
  Where Stripe sends a tech's browser when their set-up link has expired or was already used (card payments plan PR 1, https://tradeclerks.com/stripe/refresh). A new link can only come from the app, signed in, so this page only says how to get one. It reads, stores and shows nothing.
  Named refresh.html, not refresh/index.html, so GitHub Pages serves it with no trailing-slash redirect.
-->
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/style.css">
<style>
  .box { max-width: 480px; margin: 48px auto; padding: 32px 24px; background: #fff; border-radius: 14px; box-shadow: 0 1px 3px rgba(27, 42, 74, 0.08); }
  .box h1 { font-size: 22px; margin: 0 0 12px; }
  .box p { color: var(--grey); line-height: 1.6; margin: 0; }
</style>
</head>
<body>
<main class="box">
  <h1>That set-up link has expired</h1>
  <p>Stripe’s set-up links last a few minutes. Tap <strong>Done</strong> at the top to go back to Trade Clerks, then tap <strong>Card payments</strong> again to carry on where you stopped.</p>
</main>
</body>
